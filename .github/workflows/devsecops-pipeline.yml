name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. SECRET SCANNING
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. SAST (STATIC APPLICATION SECURITY TESTING)
  sast-scan:
    name: SAST (Bandit & Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (Python Security Linter)
        run: |
          # Echoue (-x) si des failles de niveau Moyen ou Élevé sont trouvées
          bandit -r app/ -ll -ii

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python

  # 3. DEPENDENCY SCANNING
  dependency-scan:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Dependency Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1' # Fait échouer le job si des vulnérabilités sont trouvées
          severity: 'CRITICAL,HIGH'

  # 4. DOCKER SCANNING
  docker-scan:
    name: Docker Image Security Scan
    needs: [secret-scan, sast-scan, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Docker Image
        run: |
          docker build -t devsecops-demo:${{ github.sha }} .

      - name: Run Trivy Docker Image Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fait échouer le job si une vulnérabilité critique est détectée
          severity: 'CRITICAL'

  # 5. BUILD & DEPLOY PREPARATION
  build:
    name: Final Build
    needs: [docker-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Confirm Build Success
        run: |
          echo " Pipeline réussi ! Aucune vulnérabilité critique ou secret détecté."